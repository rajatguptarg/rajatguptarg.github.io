<!doctype html>
<!-- Source for assets/img/social-card.png (1200x630) and the favicons.
     Render with: node .github/scripts/render-social-card.mjs
     Uses Figtree (SIL Open Font License) so the image can be shared freely. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=block" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: 'Figtree', sans-serif; color: #1a1a1a; background: #ffffff; }
      .card { width: 1200px; height: 630px; display: flex; border-top: 16px solid #1d4ed8; padding: 88px 96px 72px; flex-direction: column; }
      .name { font-size: 96px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
      .role { font-size: 42px; font-weight: 500; margin-top: 28px; }
      .position { font-size: 32px; font-weight: 500; color: #4b5563; margin-top: 40px; max-width: 900px; line-height: 1.35; }
      .url { margin-top: auto; font-size: 30px; font-weight: 700; color: #1d4ed8; }
      .icon { display: none; width: var(--size); height: var(--size); background: #1d4ed8; color: #ffffff; border-radius: calc(var(--size) * 0.18);
              align-items: center; justify-content: center; font-weight: 700; font-size: calc(var(--size) * 0.5); letter-spacing: calc(var(--size) * -0.02); }
      body.icon-mode .card { display: none; }
      body.icon-mode .icon { display: flex; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="name">Rajat Gupta</div>
      <div class="role">AVP Engineering at RBIH</div>
      <div class="position">Platform, reliability, and security engineering for systems where downtime has a real cost.</div>
      <div class="url">rajatgupta.work</div>
    </div>
    <div class="icon">RG</div>
  </body>
</html>
