---
layout: default
---
<article class="post">
  <header class="page-header">
    {% if page.role %}
      <p class="kicker">{{ page.role }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.impact %}
      <p class="dek">{{ page.impact }}</p>
    {% endif %}
    {% if page.timeline %}
      <p class="meta">{{ page.timeline }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-end">
    <p><a href="{{ '/projects/' | relative_url }}">All case studies</a> · <a href="{{ '/experience/' | relative_url }}">Full experience</a> · <a href="mailto:{{ site.email }}">Email me</a></p>
  </footer>
</article>
