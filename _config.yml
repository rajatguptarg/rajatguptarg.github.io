# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Rajat Gupta
tagline: AVP Engineering at RBIH
email: contact@rajatgupta.work
description: AVP Engineering at RBIH. I lead platform, reliability, and security engineering for systems where downtime has a real cost.
baseurl: ""
url: "https://rajatgupta.work"
domain: "rajatgupta.work"
twitter_username: rajatgupta712
github_username: rajatguptarg

# Metadata for jekyll-seo-tag (title, description, canonical URL, Open Graph,
# Twitter card and JSON-LD) and the social preview image every page falls back to.
author:
  name: Rajat Gupta
  twitter: rajatgupta712
lang: en_IN
twitter:
  username: rajatgupta712
  card: summary_large_image
social:
  name: Rajat Gupta
  links:
    - https://github.com/rajatguptarg
    - https://www.linkedin.com/in/rajatguptarg/
    - https://twitter.com/rajatgupta712
    - https://pulse.rajatgupta.work
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png
  # Short, stable post URLs. The old category-based URLs redirect through
  # redirect_from in each post's front matter (jekyll-redirect-from).
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: projects
    values:
      seo:
        type: WebPage

# Person details for the ProfilePage structured data on the homepage.
profile:
  job_title: AVP Engineering
  works_for: Reserve Bank Innovation Hub
  works_for_url: https://rbihub.in
  locality: Bengaluru
  country: IN
  knows_about:
    - Platform engineering
    - Site reliability engineering
    - Incident management
    - Security and compliance
    - Digital public infrastructure

# To verify the site in Google Search Console with the HTML tag method, uncomment
# these lines and paste the content value Search Console gives you.
# webmaster_verifications:
#   google: ""

markdown: kramdown
permalink: pretty
# Post dates are written in Indian Standard Time; without this the build runs in UTC
# and a post dated 00:00 +0100 shows the previous day.
timezone: Asia/Kolkata

collections:
  projects:
    output: true
    permalink: /projects/:name/

nav_links:
  - title: Writing
    url: /posts/
  - title: Projects
    url: /projects/
  - title: Experience
    url: /experience/
  - title: About
    url: /about/
  - title: CV
    url: /cv/
  - title: Contact
    url: /contact/


social_links:
  - label: GitHub
    url: https://github.com/rajatguptarg
  - label: LinkedIn
    url: https://www.linkedin.com/in/rajatguptarg/
  - label: Twitter
    url: https://twitter.com/rajatgupta712
  - label: Medium
    url: https://pulse.rajatgupta.work

# Body text is Figtree, self-hosted from assets/fonts/figtree/. To use Proxima
# Nova from Adobe Fonts instead, set this to the ID of an Adobe Fonts web
# project (the part before ".css" in its embed link) that includes Proxima Nova
# and allows this domain. See ADR-002 and ADR-004.
adobe_fonts_kit_id: ""

# Privacy-friendly page view counts from GoatCounter (no cookies). Set this to the
# code of your GoatCounter site (the "rajat" in rajat.goatcounter.com). While it
# is empty, no analytics script loads.
goatcounter_code: ""


# Use the default GitHub Pages theme so builds don't require external gems.
theme: minima
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Repository files that are not site content. Jekyll 3 replaces its default
# exclude list when this key is set, so the defaults are repeated here.
exclude:
  - AGENTS.md
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
