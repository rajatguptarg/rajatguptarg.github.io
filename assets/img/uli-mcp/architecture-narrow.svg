<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1372" width="480" height="1372" role="img" aria-labelledby="t d">
  <title id="t">ULI MCP server architecture</title>
  <desc id="d">Three callers (developer IDEs, a reference identity agent and a voice agent for personal loans) connect to the ULI MCP server. Five read-only discovery tools need no credentials. Four execution tools run against the ULI sandbox and send encrypted, signed requests through the ULI gateway to data service providers. All ULI credentials stay inside the server.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .box { fill: #f1eee8; stroke: #cfc8bb; stroke-width: 1.5; }
    .server { fill: none; stroke: #b23a1c; stroke-width: 2.5; }
    .inner { fill: #fbfaf7; stroke: #cfc8bb; stroke-width: 1.5; }
    .boundary { fill: none; stroke: #b23a1c; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .arrow { stroke: #54504a; stroke-width: 2; fill: none; }
    .head { fill: #54504a; }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #1b1a17; }
    .title { font-size: 24px; font-weight: 700; }
    .h { font-size: 20px; font-weight: 700; }
    .body { font-size: 18px; fill: #1b1a17; }
    .sub { font-size: 17px; fill: #54504a; }
    .note { font-size: 16px; fill: #6b665e; }
    .accent { fill: #b23a1c; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141311; }
      .box { fill: #201e1b; stroke: #45413b; }
      .server { stroke: #f2835f; }
      .inner { fill: #141311; stroke: #45413b; }
      .boundary { stroke: #f2835f; }
      .arrow { stroke: #b9b3a8; }
      .head { fill: #b9b3a8; }
      text, .body { fill: #ece8e0; }
      .sub { fill: #b9b3a8; }
      .note { fill: #9d978b; }
      .accent { fill: #f2835f; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="480" height="1372"/>

  <!-- Callers -->
  <rect class="box" x="16" y="16" width="448" height="96" rx="6"/>
  <text class="h" x="34" y="48">Developer IDE</text>
  <text class="sub" x="34" y="74">Claude Code, VS Code, Cursor</text>
  <text class="note" x="34" y="98">asks what ULI can do</text>

  <rect class="box" x="16" y="124" width="448" height="96" rx="6"/>
  <text class="h" x="34" y="156">Identity agent</text>
  <text class="sub" x="34" y="182">PAN and voter ID checks</text>
  <text class="note" x="34" y="206">reference build, 2 tools only</text>

  <rect class="box" x="16" y="232" width="448" height="96" rx="6"/>
  <text class="h" x="34" y="264">Voice agent</text>
  <text class="sub" x="34" y="290">personal loan over a phone call</text>
  <text class="note" x="34" y="314">every ULI call goes via MCP</text>

  <line class="arrow" x1="240" y1="328" x2="240" y2="372" marker-end="url(#arrowhead)"/>
  <text class="note" x="254" y="356">MCP over HTTP</text>

  <!-- ULI MCP server -->
  <rect class="server" x="16" y="376" width="448" height="646" rx="8"/>
  <text class="title" x="34" y="412">ULI MCP server</text>
  <text class="note" x="34" y="438">Python and FastMCP, one shared container</text>

  <rect class="inner" x="32" y="456" width="416" height="214" rx="6"/>
  <text class="h" x="50" y="490">Discovery tools · read-only</text>
  <text class="body" x="50" y="520">list categories</text>
  <text class="body" x="50" y="546">list services</text>
  <text class="body" x="50" y="572">get service contract (max 8 KB)</text>
  <text class="body" x="50" y="598">how-to playbooks</text>
  <text class="body" x="50" y="624">OAuth2 auth flow</text>
  <text class="note" x="50" y="654">no credentials, no PII, no gateway calls</text>

  <rect class="inner" x="32" y="684" width="416" height="188" rx="6"/>
  <text class="h" x="50" y="718">Execution tools · sandbox only</text>
  <text class="body" x="50" y="748">bank account verification</text>
  <text class="body" x="50" y="774">PAN verification</text>
  <text class="body" x="50" y="800">credit bureau check</text>
  <text class="body" x="50" y="826">voter ID verification</text>
  <text class="note" x="50" y="856">added one at a time, behind a security gate</text>

  <rect class="boundary" x="32" y="886" width="416" height="120" rx="6"/>
  <text class="body accent" x="50" y="916">Credential boundary.</text>
  <text class="body" x="50" y="942">ULI token, client ID, platform</text>
  <text class="body" x="50" y="966">certificate and lender key stay inside</text>
  <text class="body" x="50" y="990">the server. PII is never logged.</text>

  <!-- Gateway and providers -->
  <line class="arrow" x1="240" y1="1022" x2="240" y2="1064" marker-end="url(#arrowhead)"/>
  <text class="note" x="254" y="1048">encrypted, signed requests</text>

  <rect class="box" x="16" y="1068" width="448" height="110" rx="6"/>
  <text class="h" x="34" y="1100">ULI gateway</text>
  <text class="sub" x="34" y="1128">OAuth2 · AES-GCM and RSA envelope</text>
  <text class="sub" x="34" y="1154">HMAC request signing</text>

  <line class="arrow" x1="240" y1="1178" x2="240" y2="1216" marker-end="url(#arrowhead)"/>

  <rect class="box" x="16" y="1220" width="448" height="136" rx="6"/>
  <text class="h" x="34" y="1252">Data service providers</text>
  <text class="sub" x="34" y="1280">160+ APIs in 7 categories</text>
  <text class="sub" x="34" y="1306">identity · credit bureaus · income · assets</text>
  <text class="sub" x="34" y="1332">e-sign · value-added services</text>
</svg>
